<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>OLED 时钟 · BLE 调试</title>
<style>
  :root { --bg:#0f1115; --card:#1a1e26; --line:#2b3240; --fg:#e6e9ef; --dim:#8b95a5; --ok:#3ddc97; --warn:#ffb454; --err:#ff6b6b; --acc:#4d9fff; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body { margin:0; padding:12px; background:var(--bg); color:var(--fg);
         font:14px/1.5 -apple-system,"PingFang SC","Noto Sans CJK SC",sans-serif; }
  h1 { font-size:17px; margin:0 0 12px; display:flex; align-items:center; gap:8px; }
  h1 span { font-size:12px; color:var(--dim); font-weight:400; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:12px; margin-bottom:10px; }
  button { font:inherit; padding:10px 14px; border-radius:8px; border:1px solid var(--line);
           background:#232936; color:var(--fg); cursor:pointer; }
  button:active { transform:scale(.97); }
  button.primary { background:var(--acc); border-color:var(--acc); color:#06121f; font-weight:600; }
  button:disabled { opacity:.45; cursor:not-allowed; }
  input, textarea { width:100%; font:inherit; padding:9px 11px; border-radius:8px;
                    border:1px solid var(--line); background:#12161d; color:var(--fg); }
  textarea { resize:vertical; font-family:ui-monospace,Menlo,monospace; font-size:12.5px; }
  .row { display:flex; gap:8px; align-items:center; margin-bottom:8px; }
  .row > * { flex:1; }
  .row > button { flex:0 0 auto; }
  .stat { font-size:13px; color:var(--dim); }
  .stat b { color:var(--fg); font-weight:600; }
  .ok { color:var(--ok); } .err { color:var(--err); } .warn { color:var(--warn); }
  .chr { border-top:1px solid var(--line); padding-top:10px; margin-top:10px; }
  .uuid { font-family:ui-monospace,Menlo,monospace; font-size:11.5px; color:var(--dim);
          word-break:break-all; margin-bottom:6px; }
  .props { display:inline-flex; gap:6px; margin-bottom:8px; flex-wrap:wrap; }
  .tag { font-size:11px; padding:2px 7px; border-radius:999px; background:#232936;
         border:1px solid var(--line); color:var(--dim); }
  .tag.on { background:#12301f; border-color:var(--ok); color:var(--ok); }
  #log { font-family:ui-monospace,Menlo,monospace; font-size:12px; height:180px;
         overflow:auto; background:#0b0e13; border:1px solid var(--line);
         border-radius:8px; padding:8px; white-space:pre-wrap; word-break:break-all; }
  .lg { color:var(--dim); } .lg-tx { color:var(--acc); } .lg-rx { color:var(--ok); } .lg-er { color:var(--err); }
  .hint { font-size:12px; color:var(--dim); margin-top:6px; }
</style>
</head>
<body>

<h1>OLED 时钟 <span>BLE 调试</span></h1>

<div class="card">
  <div class="row">
    <button class="primary" id="btnConn">扫描并连接</button>
    <button id="btnDisc" disabled>断开</button>
  </div>
  <div class="stat" id="stat">未连接</div>
  <div class="hint">配对时输入设备屏幕上的 6 位 PIN</div>
</div>

<div class="card">
  <div class="stat" style="margin-bottom:8px">快捷命令（会自动带上当前 PIN）</div>
  <div class="row">
    <input id="pin" placeholder="6 位 PIN" maxlength="6" inputmode="numeric">
  </div>
  <div class="row" style="flex-wrap:wrap">
    <button id="qPing">ping</button>
    <button id="qGet">get</button>
    <button id="qUnpair">unpair</button>
  </div>
  <div class="row">
    <input id="ssid" placeholder="WiFi 名称">
  </div>
  <div class="row">
    <input id="pass" placeholder="WiFi 密码">
    <button id="qWifi">setwifi</button>
  </div>
  <div class="row">
    <input id="ntp" placeholder="NTP 服务器" value="ntp.aliyun.com">
    <button id="qNtp">setntp</button>
  </div>
</div>

<div class="card">
  <div class="stat" style="margin-bottom:8px">服务与特征</div>
  <div id="svcs" class="stat">连接后自动列出</div>
</div>

<div class="card">
  <div class="stat" style="margin-bottom:6px">日志</div>
  <div id="log"></div>
</div>

<script>
'use strict';

const SVC = '6e400001-b5a3-f393-e0a9-e50e24dcca9e';
const CHR = '6e400002-b5a3-f393-e0a9-e50e24dcca9e';

let device = null, server = null, chr = null, notifyOn = false;

const $ = id => document.getElementById(id);
const logEl = $('log');

function log(msg, cls) {
  const t = new Date().toLocaleTimeString('zh-CN', {hour12:false});
  const line = document.createElement('div');
  if (cls) line.className = cls;
  line.textContent = '[' + t + '] ' + msg;
  logEl.appendChild(line);
  logEl.scrollTop = logEl.scrollHeight;
  if (logEl.childElementCount > 500) logEl.removeChild(logEl.firstChild);
}

function setStat(text, cls) {
  $('stat').innerHTML = text;
  $('stat').className = 'stat ' + (cls || '');
}

if (!navigator.bluetooth) {
  setStat('此浏览器不支持 Web Bluetooth，请用 Android Chrome', 'err');
  log('navigator.bluetooth 不存在。需要 Android Chrome（桌面 Chrome 需 chrome://flags 开启）', 'lg-er');
}

function enc(s) { return new TextEncoder().encode(s); }
function dec(buf) { return new TextDecoder().decode(buf); }

/* ---------------- 扫描连接 ---------------- */
$('btnConn').onclick = async () => {
  try {
    log('请求设备…');
    device = await navigator.bluetooth.requestDevice({
      filters: [ { namePrefix: 'OLED' } ],
      optionalServices: [SVC]
    });
    log('已选择: ' + device.name);
    device.addEventListener('gattserverdisconnected', () => {
      log('连接已断开', 'lg-er');
      setStat('已断开', 'err');
      $('btnDisc').disabled = true; $('btnConn').disabled = false;
    });

    setStat('连接中…', 'warn');
    server = await device.gatt.connect();
    log('GATT 已连接', 'lg-ok');
    $('btnDisc').disabled = false; $('btnConn').disabled = true;
    setStat('已连接 <b>' + device.name + '</b>', 'ok');

    await discover();
  } catch (e) {
    log('连接失败: ' + e.message, 'lg-er');
    setStat('连接失败: ' + e.message, 'err');
  }
};

$('btnDisc').onclick = () => {
  if (device && device.gatt.connected) device.gatt.disconnect();
};

/* ---------------- 发现服务 ---------------- */
async function discover() {
  const svcs = await server.getPrimaryServices();
  log('发现 ' + svcs.length + ' 个服务');

  const box = $('svcs');
  box.innerHTML = '';
  chr = null;

  for (const svc of svcs) {
    const chrs = await svc.getCharacteristics();
    const head = document.createElement('div');
    head.className = 'uuid';
    head.textContent = '服务 ' + svc.uuid;
    box.appendChild(head);

    for (const c of chrs) {
      const props = [];
      for (const [k, v] of Object.entries({
        read: 'read', write: 'write', writeWithoutResponse: 'writeNR',
        notify: 'notify', indicate: 'indicate'
      })) if (c.properties[k]) props.push(v);

      const wrap = document.createElement('div');
      wrap.className = 'chr';
      wrap.innerHTML =
        '<div class="uuid">特征 ' + c.uuid + '</div>' +
        '<div class="props">' + props.map(p => '<span class="tag">' + p + '</span>').join('') + '</div>';

      if (c.properties.read) {
        const b = document.createElement('button');
        b.textContent = '读取';
        b.onclick = async () => {
          try { const v = await c.readValue(); const s = dec(v); log('READ ' + s, 'lg-rx'); b.dataset.last = s; }
          catch (e) { log('读取失败: ' + e.message, 'lg-er'); }
        };
        wrap.appendChild(b);
      }

      if (c.properties.write || c.properties.writeWithoutResponse) {
        const ta = document.createElement('textarea');
        ta.rows = 2; ta.placeholder = 'UTF-8 文本，例如 {"pin":"123456","action":"ping"}';
        const b = document.createElement('button');
        b.textContent = '写入';
        b.onclick = async () => {
          const s = ta.value.trim();
          if (!s) return;
          try {
            await c.writeValueWithResponse(enc(s));
            log('TX ' + s, 'lg-tx');
          } catch (e) {
            log('写入失败: ' + e.message, 'lg-er');
          }
        };
        wrap.appendChild(ta); wrap.appendChild(b);
      }

      if (c.properties.notify || c.properties.indicate) {
        const b = document.createElement('button');
        b.textContent = '订阅通知';
        b.onclick = async () => {
          try {
            if (!notifyOn) {
              await c.startNotifications();
              c.addEventListener('characteristicvaluechanged', ev => {
                log('RX ' + dec(ev.target.value), 'lg-rx');
              });
              notifyOn = true; b.textContent = '取消订阅'; b.classList.add('primary');
              log('已订阅通知', 'lg-ok');
            } else {
              await c.stopNotifications();
              notifyOn = false; b.textContent = '订阅通知'; b.classList.remove('primary');
              log('已取消订阅');
            }
          } catch (e) { log('订阅失败: ' + e.message, 'lg-er'); }
        };
        wrap.appendChild(b);
      }

      box.appendChild(wrap);

      if (c.uuid === CHR) {
        chr = c;
        log('找到主特征 ' + CHR, 'lg-ok');
        if (c.properties.notify) {
          await c.startNotifications();
          c.addEventListener('characteristicvaluechanged', ev => log('RX ' + dec(ev.target.value), 'lg-rx'));
          notifyOn = true;
          log('已自动订阅通知', 'lg-ok');
        }
      }
    }
  }
  if (!chr) log('未找到 ' + CHR + '，请确认固件已烧录', 'lg-er');
}

/* ---------------- 发命令 ---------------- */
async function send(obj) {
  if (!chr) { log('未连接或无主特征', 'lg-er'); return; }
  const s = JSON.stringify(obj);
  try {
    await chr.writeValueWithResponse(enc(s));
    log('TX ' + s, 'lg-tx');
  } catch (e) { log('发送失败: ' + e.message, 'lg-er'); }
}

function pin() {
  const p = $('pin').value.trim();
  if (!/^\d{6}$/.test(p)) { log('先填 6 位 PIN', 'lg-er'); return null; }
  return p;
}

$('qPing').onclick = () => { const p = pin(); if (p) send({pin:p, action:'ping'}); };
$('qGet').onclick  = () => { const p = pin(); if (p) send({pin:p, action:'get'});  };
$('qUnpair').onclick = () => { const p = pin(); if (p) send({pin:p, action:'unpair'}); };
$('qWifi').onclick = () => {
  const p = pin(); if (!p) return;
  const ssid = $('ssid').value.trim(), pass = $('pass').value;
  if (!ssid) { log('先填 WiFi 名称', 'lg-er'); return; }
  send({pin:p, action:'setwifi', params:{ssid, pass}});
};
$('qNtp').onclick = () => {
  const p = pin(); if (!p) return;
  send({pin:p, action:'setntp', params:{server:$('ntp').value.trim() || 'ntp.aliyun.com', tz:8}});
};

log('页面就绪。先让设备进入蓝牙配置页（长按 # → 输 101 → #），屏幕会显示 6 位 PIN。');
</script>
</body>
</html>
