name: android

on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        working-directory: android
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: oled-panel-debug
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk oled-panel.apk

      - name: Publish prerelease
        uses: softprops/action-gh-release@v2
        with:
          prerelease: true
          tag_name: apk-build-${{ github.run_number }}
          name: apk-build-${{ github.run_number }}
          body: |
            自动构建的 Android 配置 App（debug 签名）
            - oled-panel.apk：可直接安装
          files: oled-panel.apk
